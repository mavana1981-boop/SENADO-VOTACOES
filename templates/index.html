<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presença e Votações — Senado Federal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --verde: #1A6B3A; --azul: #0D2B5E; }
    body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; font-size: 0.92rem; }

    .header {
      background: #fff;
      border-bottom: 3px solid var(--verde);
      padding: 0.7rem 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
    }
    .logo-header { width: 85px; height: 52px; object-fit: contain; }
    .titulo-app { color: var(--verde); font-size: 1.35rem; font-weight: 700; margin: 0; }
    .subtitulo-app { color: #555; font-size: 0.85rem; margin: 0; }

    .card-filtro { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 1.2rem; }
    .btn-verde { background: var(--verde); color: #fff; border: none; }
    .btn-verde:hover { background: #155c30; color: #fff; }
    .btn-outline-verde { color: var(--verde); border-color: var(--verde); }
    .btn-outline-verde:hover { background: var(--verde); color: #fff; }

    /* Card senador */
    .sen-card {
      border: 1.5px solid #dee2e6; border-radius: 8px; background: #fff;
      padding: 0.7rem; cursor: pointer; transition: all 0.18s;
      display: flex; align-items: center; gap: 0.7rem;
    }
    .sen-card:hover { border-color: var(--verde); box-shadow: 0 2px 8px rgba(26,107,58,0.12); }
    .sen-card.selected { border-color: var(--verde); background: #f0fdf4; }
    .sen-foto { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #dee2e6; }
    .sen-nome { font-weight: 600; font-size: 0.88rem; color: #1a1a1a; }
    .sen-info { font-size: 0.76rem; color: #666; }
    .sen-check { margin-left: auto; color: var(--verde); display: none; font-size: 1.1rem; }
    .sen-card.selected .sen-check { display: block; }

    /* Resultado */
    .result-card {
      background: #fff; border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden; margin-bottom: 1rem;
    }
    .result-header {
      background: linear-gradient(135deg, var(--verde), #228B22);
      color: #fff; padding: 0.8rem 1rem;
      display: flex; align-items: center; gap: 0.8rem;
    }
    .result-foto { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.5); }
    .result-nome { font-size: 1.05rem; font-weight: 700; }
    .result-partido { font-size: 0.82rem; opacity: 0.9; }

    .stat-box {
      text-align: center; padding: 0.8rem;
      border-right: 1px solid #dee2e6;
    }
    .stat-box:last-child { border-right: none; }
    .stat-num { font-size: 1.6rem; font-weight: 700; color: var(--azul); line-height: 1; }
    .stat-label { font-size: 0.72rem; color: #666; margin-top: 2px; }
    .stat-sim { color: var(--verde); }
    .stat-nao { color: #8B0000; }
    .stat-abs { color: #7B5C00; }

    .progress-thin { height: 8px; border-radius: 4px; }

    .tag-filtro {
      display: inline-block; background: #e8f5e9; color: var(--verde);
      border: 1px solid #a5d6a7; border-radius: 4px;
      padding: 2px 8px; font-size: 0.78rem; margin: 2px;
      cursor: pointer;
    }
    .tag-filtro:hover { background: var(--verde); color: #fff; }
    .tag-filtro.ativo { background: var(--verde); color: #fff; }

    .spinner-area { text-align: center; padding: 2rem; display: none; }
    #resultado-container { display: none; }

    .search-box { position: relative; }
    .search-box input { padding-left: 2.2rem; }
    .search-box .fa-search { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: #aaa; }

    @media (max-width: 768px) {
      .stat-box { border-right: none; border-bottom: 1px solid #dee2e6; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="container d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-3">
      <img src="/static/logo_minoria.png" class="logo-header" onerror="this.style.display='none'">
      <img src="/static/logo_oposicao.png" class="logo-header" onerror="this.style.display='none'">
      <div>
        <h1 class="titulo-app">Presença & Votações — Senado Federal</h1>
        <p class="subtitulo-app">Lideranças da Minoria e da Oposição — Câmara dos Deputados</p>
      </div>
    </div>
  </div>
</div>

<div class="container my-4">
  <div class="row g-3">

    <!-- Painel esquerdo: filtros e seleção -->
    <div class="col-md-4">
      <div class="card-filtro mb-3">
        <h6 class="fw-bold mb-3"><i class="fas fa-filter me-2 text-success"></i>Filtros</h6>

        <div class="mb-3">
          <label class="form-label fw-bold small">Ano / Legislatura:</label>
          <select class="form-select form-select-sm" id="select-ano">
            {% for ano in anos %}
            <option value="{{ ano }}" {% if ano == ano_atual %}selected{% endif %}>{{ ano }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-2">
          <label class="form-label fw-bold small">Filtrar por Partido:</label>
          <div id="tags-partidos" class="mb-2"></div>
        </div>

        <div class="mb-2">
          <label class="form-label fw-bold small">Filtrar por UF:</label>
          <div id="tags-ufs" class="mb-2"></div>
        </div>
      </div>

      <div class="card-filtro">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold mb-0"><i class="fas fa-users me-2 text-success"></i>Senadores</h6>
          <span class="badge bg-success" id="count-selecionados">0 selecionados</span>
        </div>

        <div class="search-box mb-2">
          <i class="fas fa-search"></i>
          <input type="text" class="form-control form-control-sm" id="busca-senador" placeholder="Buscar senador...">
        </div>

        <div class="d-flex gap-1 mb-2">
          <button class="btn btn-outline-success btn-sm w-50" onclick="selecionarTodos()">Todos</button>
          <button class="btn btn-outline-secondary btn-sm w-50" onclick="limparSelecao()">Limpar</button>
        </div>

        <div id="lista-senadores" style="max-height:500px; overflow-y:auto;">
          {% for sen in senadores %}
          <div class="sen-card mb-1" data-codigo="{{ sen.codigo }}"
               data-nome="{{ sen.nome }}" data-partido="{{ sen.partido }}" data-uf="{{ sen.uf }}"
               onclick="toggleSenador(this)">
            <img src="{{ sen.foto }}" class="sen-foto" onerror="this.src='/static/sem_foto.png'" alt="">
            <div>
              <div class="sen-nome">{{ sen.nome }}</div>
              <div class="sen-info">{{ sen.partido }} / {{ sen.uf }}</div>
            </div>
            <i class="fas fa-check-circle sen-check"></i>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- Painel direito: resultados -->
    <div class="col-md-8">
      <div class="d-flex gap-2 mb-3">
        <button class="btn btn-verde px-4" id="btn-gerar" onclick="gerarRelatorio()">
          <i class="fas fa-chart-bar me-2"></i>Gerar Relatório
        </button>
        <button class="btn btn-outline-verde" id="btn-exportar-pdf" style="display:none;" onclick="exportarPDF()">
          <i class="fas fa-file-pdf me-2"></i>Exportar PDF
        </button>
        <button class="btn btn-outline-success" id="btn-exportar-csv" style="display:none;" onclick="exportarCSV()">
          <i class="fas fa-file-csv me-2"></i>Exportar CSV
        </button>
      </div>

      <div class="spinner-area" id="spinner">
        <div class="spinner-border text-success" style="width:3rem;height:3rem;"></div>
        <p class="mt-3 text-muted">Consultando dados do Senado Federal...<br>
        <small>Isso pode levar alguns segundos.</small></p>
      </div>

      <div id="resultado-container"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Dados dos senadores
  const todosSenadores = {{ senadores | tojson }};
  let selecionados = new Set();
  let resultadosCache = [];
  let filtroPartido = null;
  let filtroUF = null;

  // Inicializa filtros de partido e UF
  function initFiltros() {
    const partidos = [...new Set(todosSenadores.map(s => s.partido))].sort();
    const ufs      = [...new Set(todosSenadores.map(s => s.uf))].sort();

    const divP = document.getElementById('tags-partidos');
    partidos.forEach(p => {
      const el = document.createElement('span');
      el.className = 'tag-filtro';
      el.textContent = p;
      el.onclick = () => toggleFiltroPartido(p, el);
      divP.appendChild(el);
    });

    const divUF = document.getElementById('tags-ufs');
    ufs.forEach(u => {
      const el = document.createElement('span');
      el.className = 'tag-filtro';
      el.textContent = u;
      el.onclick = () => toggleFiltroUF(u, el);
      divUF.appendChild(el);
    });
  }

  function toggleFiltroPartido(partido, el) {
    filtroPartido = filtroPartido === partido ? null : partido;
    document.querySelectorAll('#tags-partidos .tag-filtro').forEach(t => t.classList.remove('ativo'));
    if (filtroPartido) el.classList.add('ativo');
    filtrarLista();
  }

  function toggleFiltroUF(uf, el) {
    filtroUF = filtroUF === uf ? null : uf;
    document.querySelectorAll('#tags-ufs .tag-filtro').forEach(t => t.classList.remove('ativo'));
    if (filtroUF) el.classList.add('ativo');
    filtrarLista();
  }

  function filtrarLista() {
    const busca = document.getElementById('busca-senador').value.toLowerCase();
    document.querySelectorAll('.sen-card').forEach(card => {
      const nome    = card.dataset.nome.toLowerCase();
      const partido = card.dataset.partido;
      const uf      = card.dataset.uf;
      const ok = (!busca || nome.includes(busca)) &&
                 (!filtroPartido || partido === filtroPartido) &&
                 (!filtroUF || uf === filtroUF);
      card.style.display = ok ? 'flex' : 'none';
    });
  }

  function toggleSenador(card) {
    const cod = card.dataset.codigo;
    if (selecionados.has(cod)) {
      selecionados.delete(cod);
      card.classList.remove('selected');
    } else {
      selecionados.add(cod);
      card.classList.add('selected');
    }
    atualizarContador();
  }

  function selecionarTodos() {
    document.querySelectorAll('.sen-card:not([style*="display: none"])').forEach(card => {
      selecionados.add(card.dataset.codigo);
      card.classList.add('selected');
    });
    atualizarContador();
  }

  function limparSelecao() {
    selecionados.clear();
    document.querySelectorAll('.sen-card').forEach(c => c.classList.remove('selected'));
    atualizarContador();
  }

  function atualizarContador() {
    document.getElementById('count-selecionados').textContent = `${selecionados.size} selecionados`;
  }

  async function gerarRelatorio() {
    if (selecionados.size === 0) {
      alert('Selecione ao menos um senador.');
      return;
    }

    const ano = document.getElementById('select-ano').value;
    document.getElementById('spinner').style.display = 'block';
    document.getElementById('resultado-container').style.display = 'none';
    document.getElementById('btn-exportar-pdf').style.display = 'none';
    document.getElementById('btn-exportar-csv').style.display = 'none';

    try {
      const r = await fetch('/api/relatorio', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ codigos: [...selecionados], ano: parseInt(ano) })
      });
      const j = await r.json();
      resultadosCache = j.resultado || [];
      renderResultados(j.resultado, todosSenadores, ano);
      document.getElementById('btn-exportar-pdf').style.display = 'inline-block';
      document.getElementById('btn-exportar-csv').style.display = 'inline-block';
    } catch(e) {
      alert('Erro ao buscar dados: ' + e.message);
    } finally {
      document.getElementById('spinner').style.display = 'none';
    }
  }

  function renderResultados(resultados, senadores, ano) {
    const senMap = {};
    senadores.forEach(s => senMap[s.codigo] = s);

    const container = document.getElementById('resultado-container');
    container.style.display = 'block';

    if (!resultados || resultados.length === 0) {
      container.innerHTML = '<div class="alert alert-info">Nenhum dado encontrado para os filtros selecionados.</div>';
      return;
    }

    let html = `<h5 class="mb-3 text-success"><i class="fas fa-chart-bar me-2"></i>Relatório ${ano} — ${resultados.length} senador(es)</h5>`;

    resultados.forEach(res => {
      const sen = senMap[res.codigo] || {};
      const v   = res.votacoes || {};
      const p   = res.presencas || {};
      const pct = p.pct_presenca || 0;
      const corPct = pct >= 75 ? 'success' : pct >= 50 ? 'warning' : 'danger';
      const notaPresenca = p.total === 0
        ? '<small class="text-muted">Dados de sessões não disponíveis para este ano</small>'
        : '';

      html += `
      <div class="result-card">
        <div class="result-header">
          <img src="${sen.foto || ''}" class="result-foto" onerror="this.src='/static/sem_foto.png'">
          <div>
            <div class="result-nome">${sen.nome || 'Senador ' + res.codigo}</div>
            <div class="result-partido">${sen.partido || ''} / ${sen.uf || ''} &nbsp;|&nbsp; Ano: ${ano}</div>
          </div>
        </div>
        <div class="p-3">
          <div class="row g-0 mb-3">
            <div class="col-6">
              <div class="stat-box border-end">
                <div class="stat-num">${v.total || 0}</div>
                <div class="stat-label">Votações Nominais</div>
              </div>
              <div class="row g-0 mt-2">
                <div class="col-4 text-center">
                  <div class="stat-num stat-sim" style="font-size:1.1rem">${v.sim || 0}</div>
                  <div class="stat-label">SIM</div>
                </div>
                <div class="col-4 text-center">
                  <div class="stat-num stat-nao" style="font-size:1.1rem">${v.nao || 0}</div>
                  <div class="stat-label">NÃO</div>
                </div>
                <div class="col-4 text-center">
                  <div class="stat-num stat-abs" style="font-size:1.1rem">${v.abstencao || 0}</div>
                  <div class="stat-label">ABS</div>
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="stat-box">
                <div class="stat-num">${p.total || p.presente || 0}</div>
                <div class="stat-label">Sessões no Plenário</div>
              </div>
              <div class="mt-2 px-3">
                <div class="d-flex justify-content-between small mb-1">
                  <span>Presença: <strong>${p.presente || 0}</strong></span>
                  <span>Ausente: <strong>${p.ausente || 0}</strong></span>
                </div>
                <div class="progress progress-thin">
                  <div class="progress-bar bg-${corPct}" style="width:${pct}%"></div>
                </div>
                <div class="text-center mt-1">
                  <span class="badge bg-${corPct}">${pct}% de presença</span>
                </div>
                ${notaPresenca}
              </div>
            </div>
          </div>
        </div>
      </div>`;
    });

    container.innerHTML = html;
  }

  async function exportarPDF() {
    if (resultadosCache.length === 0) return;
    const ano = document.getElementById('select-ano').value;

    const r = await fetch('/api/exportar_pdf', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        senadores: todosSenadores,
        resultados: resultadosCache,
        ano: parseInt(ano)
      })
    });
    const blob = await r.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `relatorio_senado_${ano}.pdf`;
    a.click();
  }

  function exportarCSV() {
    if (resultadosCache.length === 0) return;
    const ano    = document.getElementById('select-ano').value;
    const senMap = {};
    todosSenadores.forEach(s => senMap[s.codigo] = s);

    let csv = 'Nome,Partido,UF,Votações Nominais,Votos SIM,Votos NÃO,Abstenções,Total Sessões,Presente,Ausente,Justificado,% Presença\n';
    resultadosCache.forEach(res => {
      const sen = senMap[res.codigo] || {};
      const v   = res.votacoes || {};
      const p   = res.presencas || {};
      csv += `"${sen.nome || ''}","${sen.partido || ''}","${sen.uf || ''}",${v.total||0},${v.sim||0},${v.nao||0},${v.abstencao||0},${p.total||0},${p.presente||0},${p.ausente||0},${p.justificado||0},${p.pct_presenca||0}\n`;
    });

    const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `relatorio_senado_${ano}.csv`;
    a.click();
  }

  // Init
  document.getElementById('busca-senador').addEventListener('input', filtrarLista);
  initFiltros();
</script>
</body>
</html>
